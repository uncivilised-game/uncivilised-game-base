<!DOCTYPE html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body style="margin:0;padding:0;background:#0d0f0e;font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">
<table width="100%" cellpadding="0" cellspacing="0" style="background:#0d0f0e;padding:40px 20px"><tr><td align="center">
<table width="620" cellpadding="0" cellspacing="0" style="max-width:620px;width:100%">

<!-- HEADER -->
<tr><td style="padding:0 0 10px">
  <table width="100%" cellpadding="0" cellspacing="0"><tr>
    <td style="text-align:left;vertical-align:middle">
      <svg viewBox="0 0 400 60" width="260" height="39" aria-label="Uncivilised" style="display:block">
        <defs>
          <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#c9a84c"/>
            <stop offset="100%" stop-color="#8b6914"/>
          </linearGradient>
        </defs>
        <text x="0" y="44" font-family="Cormorant Garamond, Georgia, serif" font-weight="700" font-size="48" fill="url(#lg)">UNCIVILISED</text>
        <line x1="0" y1="54" x2="360" y2="54" stroke="#c9a84c" stroke-width="0.5" opacity="0.6"/>
      </svg>
    </td>
    <td style="text-align:right;vertical-align:middle">
      <span style="color:#c9a84c;font-size:11px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase">Feedback Digest</span>
    </td>
  </tr></table>
</td></tr>

<!-- thin gold line -->
<tr><td style="padding:0 0 24px"><div style="height:1px;background:linear-gradient(to right,#c9a84c50,transparent)"></div></td></tr>

<!-- DATE + STATS -->
<tr><td style="padding:0 0 20px">
  <div style="color:#e8e0d0;font-family:'Cormorant Garamond',Georgia,serif;font-size:22px;font-weight:600;padding-bottom:4px">{{date}}</div>
  <div style="color:#8a8578;font-size:13px">{{total_count}} items in the last {{hours}} hours</div>
</td></tr>

<!-- PRIORITY STATS -->
<tr><td style="padding:0 0 24px">
  <table cellpadding="0" cellspacing="0" style="background:#151715;border:1px solid #222220;border-radius:8px;overflow:hidden">
    <tr>{{stats_row}}</tr>
  </table>
</td></tr>

<!-- EXECUTIVE SUMMARY -->
<tr><td style="padding:0 0 4px">
  <div style="color:#c9a84c;font-size:11px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase">Summary</div>
</td></tr>
<tr><td style="padding:0 0 20px">
  <div style="background:#151715;border:1px solid #222220;border-radius:8px;padding:16px 18px;color:#b8b0a0;font-size:14px;line-height:22px">
    {{executive_summary}}
  </div>
</td></tr>

<!-- CATEGORY SECTIONS -->
{{category_sections}}

<!-- FOOTER -->
<tr><td style="padding:28px 0 0"><div style="height:1px;background:linear-gradient(to right,transparent,#c9a84c15,transparent)"></div></td></tr>
<tr><td style="color:#5a5548;font-size:12px;line-height:18px;padding:16px 0 0;text-align:center">
  Uncivilised Feedback Digest &mdash; <a href="https://uncivilized.fun" style="color:#8a8578;text-decoration:none">uncivilized.fun</a>
</td></tr>

</table></td></tr></table></body></html>
