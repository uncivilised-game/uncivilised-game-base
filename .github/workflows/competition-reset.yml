name: Weekly Competition Reset

on:
  schedule:
    # Every Sunday at midnight UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview without making changes (true/false)'
        required: false
        default: 'false'
      test_email:
        description: 'Send winner emails to this address instead of real players'
        required: false
        default: ''

jobs:
  reset:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Reset competition and email winners
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          TEST_EMAIL: ${{ github.event.inputs.test_email || '' }}
        run: python scripts/competition-reset.py
