name: Feedback Digest

on:
  schedule:
    # Every morning at 8am UTC
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      hours:
        description: 'Hours of feedback to include (default: 24)'
        required: false
        default: '24'
      dry_run:
        description: 'Dry run (print to logs, no email)'
        required: false
        type: boolean
        default: false

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run feedback digest
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DIGEST_EMAIL: ${{ secrets.DIGEST_EMAIL }}
          HOURS: ${{ inputs.hours || '24' }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: python scripts/feedback-digest.py
